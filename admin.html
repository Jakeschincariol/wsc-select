<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Nominations — WSC Select</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="stylesheet" href="styles.css" />
<style>
  body{background:var(--green-deep);min-height:100vh}
  .p{width:min(1180px,100% - 3rem);margin-inline:auto;padding:clamp(2rem,6vw,4rem) 0}
  .p__top{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
    flex-wrap:wrap;margin-bottom:var(--s8)}
  .p__title{font-family:var(--serif);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem)}
  .p__meta{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;
    letter-spacing:.16em;color:var(--muted-film)}
  .gate{max-width:400px;margin:12vh auto;text-align:left}
  .gate h1{font-family:var(--serif);font-size:1.9rem;margin-bottom:var(--s5)}
  .gate label{display:block;font-family:var(--mono);font-size:.66rem;text-transform:uppercase;
    letter-spacing:.16em;color:var(--muted-film);margin-bottom:var(--s2)}
  .gate input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--hair-film);
    padding:12px 0;font-size:1.0625rem;color:var(--parchment)}
  .gate input:focus{outline:0;border-bottom-color:var(--gold-soft)}
  .gate .cta{margin-top:var(--s6)}
  .msg{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;
    min-height:1.2em;margin-top:var(--s4);color:#E8A0A0}
  table{width:100%;border-collapse:collapse}
  th{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.16em;
    color:var(--muted-film);text-align:left;padding:0 var(--s4) var(--s3);font-weight:500;
    border-bottom:1px solid var(--hair-film)}
  td{padding:var(--s4);border-bottom:1px solid var(--hair-film);vertical-align:top;font-size:.95rem}
  tr:hover td{background:rgba(245,240,230,.03)}
  .who{font-family:var(--serif);font-size:1.15rem;color:var(--parchment)}
  .sub{color:var(--muted-film);font-size:.86rem;margin-top:2px}
  .notes{color:var(--muted-film);max-width:34ch}
  a.mail{color:var(--gold-soft);text-decoration:none;border-bottom:1px solid var(--hair-gold)}
  select{background:var(--green);color:var(--parchment);border:1px solid var(--hair-film);
    padding:7px 10px;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;
    letter-spacing:.12em}
  .empty{padding:var(--s9) 0;text-align:center;color:var(--muted-film)}
  .bar2{display:flex;gap:var(--s5);align-items:center;flex-wrap:wrap;margin-bottom:var(--s6)}
  .count{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold-soft)}
</style>
</head>
<body>

<section id="gate" class="gate">
  <h1>Nominations</h1>
  <form id="gateForm">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />
    <p class="msg" id="gateMsg" role="status" aria-live="polite"></p>
    <button class="cta" type="submit"><span>Sign in</span></button>
  </form>
</section>

<section id="portal" class="p" hidden>
  <div class="p__top">
    <div>
      <p class="p__title">Nominations</p>
      <p class="p__meta">WSC Select</p>
    </div>
    <div class="bar2">
      <button class="cta cta--line" id="refresh" type="button"><span>Refresh</span></button>
      <button class="cta cta--line" id="csv" type="button"><span>Export CSV</span></button>
      <button class="cta cta--line" id="out" type="button"><span>Sign out</span></button>
    </div>
  </div>
  <p class="count" id="count"></p>
  <div id="wrap"></div>
</section>

<script>
(function () {
  var gate = document.getElementById("gate"), portal = document.getElementById("portal");
  var rows = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function when(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" })
      + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function draw() {
    document.getElementById("count").textContent =
      rows.length + (rows.length === 1 ? " nomination" : " nominations");
    if (!rows.length) {
      document.getElementById("wrap").innerHTML =
        '<p class="empty">No nominations yet.</p>';
      return;
    }
    var html = '<table><thead><tr><th>Player</th><th>Club</th><th>Nominated by</th>'
      + '<th>Notes</th><th>Received</th><th>Status</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr>'
        + '<td><div class="who">' + esc(r.player_name) + '</div>'
        +     '<div class="sub">' + esc(r.age_group) + '</div></td>'
        + '<td>' + esc(r.current_club) + '</td>'
        + '<td>' + esc(r.nominated_by) + '<div class="sub">'
        +     '<a class="mail" href="mailto:' + esc(r.contact_email) + '">' + esc(r.contact_email) + '</a></div></td>'
        + '<td class="notes">' + esc(r.notes || "—") + '</td>'
        + '<td class="sub">' + when(r.created_at) + '</td>'
        + '<td><select data-id="' + r.id + '">'
        +   ["new", "reviewing", "invited", "declined"].map(function (s) {
              return '<option value="' + s + '"' + (r.status === s ? " selected" : "") + '>' + s + '</option>';
            }).join("")
        + '</select></td></tr>';
    });
    document.getElementById("wrap").innerHTML = html + "</tbody></table>";

    document.querySelectorAll("select[data-id]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        fetch("/api/nominations", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: sel.dataset.id, status: sel.value })
        });
      });
    });
  }

  function load() {
    return fetch("/api/nominations").then(function (r) {
      if (r.status === 401) throw new Error("auth");
      return r.json();
    }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "failed");
      rows = d.rows || [];
      gate.hidden = true; portal.hidden = false;
      draw();
    });
  }

  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = document.getElementById("gateMsg");
    msg.textContent = "Checking…";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { msg.textContent = d.error || "Incorrect password."; return; }
        msg.textContent = "";
        return load();
      })
      .catch(function () { msg.textContent = "Something went wrong."; });
  });

  document.getElementById("refresh").addEventListener("click", function () { load(); });
  document.getElementById("out").addEventListener("click", function () {
    fetch("/api/login", { method: "DELETE" }).then(function () { location.reload(); });
  });
  document.getElementById("csv").addEventListener("click", function () {
    var head = ["received", "player", "age_group", "club", "nominated_by", "email", "notes", "status"];
    var lines = [head.join(",")].concat(rows.map(function (r) {
      return [r.created_at, r.player_name, r.age_group, r.current_club,
              r.nominated_by, r.contact_email, (r.notes || "").replace(/\s+/g, " "), r.status]
        .map(function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(",");
    }));
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = "wsc-select-nominations.csv";
    a.click();
  });

  /* already signed in? go straight through */
  load().catch(function () {});
})();
</script>
</body>
</html>
